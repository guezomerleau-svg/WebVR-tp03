<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exercice 4 | Cibles A-Frame</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script><style>body{margin:0;font-family:monospace}.hud{position:fixed;z-index:5;top:24px;left:28px;color:#fff;pointer-events:none;text-shadow:0 2px 5px #000}.hud h1{margin:0 0 8px;font:600 30px sans-serif}.hud p{margin:0;font-size:13px}.hud strong{color:#b9ef72}.help{position:fixed;z-index:5;right:28px;bottom:24px;color:#fff;pointer-events:none;text-shadow:0 2px 5px #000;font-size:12px}</style></head><body><div class="hud"><h1>Cibles A-Frame</h1><p><strong id="score">0</strong> impacts · <span id="status">Cliquez pour tirer</span></p></div><div class="help">Clic : tirer · R : réinitialiser · Souris : regarder</div><a-scene physics="gravity: -9.8" background="color: #0d1110" renderer="colorManagement: true; shadows: true"><a-entity light="type: ambient; color: #b8d4c0; intensity: 1.4"></a-entity><a-entity light="type: directional; color: #ffe5c4; intensity: 2.5; castShadow: true" position="-4 7 4"></a-entity><a-plane rotation="-90 0 0" width="40" height="40" color="#18231c" static-body></a-plane><a-entity id="targets"></a-entity><a-entity id="projectiles"></a-entity><a-entity position="0 1.6 6"><a-camera look-controls wasd-controls="enabled: false"><a-cursor rayOrigin="mouse" color="#b9ef72" fuse="false"></a-cursor></a-camera></a-entity></a-scene><script>
const targetsRoot=document.querySelector('#targets'),projectilesRoot=document.querySelector('#projectiles'),statusElement=document.querySelector('#status'),scoreElement=document.querySelector('#score');let score=0;const types=[{tag:'a-box',geometry:'width: .7; height: .7; depth: .7',color:'#d96c4f',radius:.55},{tag:'a-cone',geometry:'radius-bottom: .45; radius-top: 0; height: .9',color:'#e0b04f',radius:.58},{tag:'a-cylinder',geometry:'radius: .43; height: .8',color:'#68a991',radius:.55}];
function randomTarget(){if(targetsRoot.children.length>=7)return;const type=types[Math.floor(Math.random()*types.length)],target=document.createElement(type.tag);target.setAttribute('geometry',type.geometry);target.setAttribute('material',`color: ${type.color}; roughness: .55`);target.setAttribute('position',`${(Math.random()*8-4).toFixed(2)} ${(Math.random()*2.2+.6).toFixed(2)} ${(Math.random()*-11-2).toFixed(2)}`);target.setAttribute('dynamic-body','shape: box; mass: 1');target.classList.add('target');target.dataset.radius=type.radius;target.addEventListener('collide',event=>{if(event.detail.body.el?.classList.contains('projectile'))impact(target,event.detail.body.el)});targetsRoot.appendChild(target)}
function fire(){const projectile=document.createElement('a-sphere');projectile.setAttribute('radius','.07');projectile.setAttribute('color','#ffd36b');projectile.setAttribute('material','emissive: #ff8c24');projectile.setAttribute('position','0 1.6 5.3');projectile.setAttribute('dynamic-body','shape: sphere; mass: .05; linearDamping: 0');projectile.setAttribute('velocity','0 0 -28');projectile.classList.add('projectile');projectile.addEventListener('collide',event=>{const other=event.detail.body.el;if(other?.classList.contains('target'))impact(other,projectile)});projectilesRoot.appendChild(projectile);statusElement.textContent='Projectile lancé';setTimeout(()=>projectile.parentNode?.removeChild(projectile),3000)}
function impact(target,projectile){if(!target.parentNode||projectile.dataset.spent)return;projectile.dataset.spent='true';createParticles(target.object3D.position);playHitSound();target.remove();projectile.remove();score++;scoreElement.textContent=score;statusElement.textContent='Impact détecté'}function createParticles(position){for(let i=0;i<12;i++){const particle=document.createElement('a-sphere');particle.setAttribute('radius','.035');particle.setAttribute('color','#ffd36b');particle.setAttribute('position',`${position.x} ${position.y} ${position.z}`);particle.setAttribute('animation',`property: position; to: ${position.x+Math.random()*2-1} ${position.y+Math.random()*2} ${position.z+Math.random()*2-1}; dur: 450; easing: easeOutQuad`);document.querySelector('a-scene').appendChild(particle);setTimeout(()=>particle.remove(),500)}}function playHitSound(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;window.hitAudio??=new C;const now=hitAudio.currentTime,o=hitAudio.createOscillator(),g=hitAudio.createGain();o.type='triangle';o.frequency.setValueAtTime(520,now);o.frequency.exponentialRampToValueAtTime(160,now+.12);g.gain.setValueAtTime(.18,now);g.gain.exponentialRampToValueAtTime(.001,now+.12);o.connect(g).connect(hitAudio.destination);o.start();o.stop(now+.12)}function reset(){[...targetsRoot.children,...projectilesRoot.children].forEach(entity=>entity.remove());score=0;scoreElement.textContent='0';statusElement.textContent='Cibles réinitialisées'}document.body.addEventListener('click',()=>{window.hitAudio?.resume();fire()});addEventListener('keydown',event=>{if(event.code==='KeyR')reset()});setInterval(randomTarget,1500);for(let i=0;i<3;i++)randomTarget();</script></body></html>
