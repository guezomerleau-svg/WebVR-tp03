<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exercice 4 | Cibles A-Frame</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>body{margin:0;font-family:monospace}.hud{position:fixed;z-index:5;top:24px;left:28px;color:#fff;pointer-events:none;text-shadow:0 2px 5px #000}.hud h1{margin:0 0 8px;font:600 30px sans-serif}.hud p{margin:0;font-size:13px}.hud strong{color:#b9ef72}.help{position:fixed;z-index:5;right:28px;bottom:24px;color:#fff;pointer-events:none;text-shadow:0 2px 5px #000;font-size:12px}</style></head><body><div class="hud"><h1>Cibles A-Frame</h1><p><strong id="score">0</strong> impacts · <span id="status">Cliquez pour tirer</span></p></div><div class="help">Espace / clic : tirer · WASD : se déplacer · R : réinitialiser · Souris : regarder</div><a-scene background="color: #0d1110" renderer="colorManagement: true; shadows: true"><a-entity light="type: ambient; color: #b8d4c0; intensity: 1.4"></a-entity><a-entity light="type: directional; color: #ffe5c4; intensity: 2.5; castShadow: true" position="-4 7 4"></a-entity><a-plane rotation="-90 0 0" width="40" height="40" color="#18231c"></a-plane><a-entity id="targets"></a-entity><a-entity id="projectiles"></a-entity><a-entity position="0 1.6 6"><a-camera look-controls wasd-controls="enabled: true; acceleration: 20"><a-cursor rayOrigin="mouse" color="#b9ef72" fuse="false"></a-cursor></a-camera></a-entity></a-scene><script>
const sceneElement=document.querySelector('a-scene'),targetsRoot=document.querySelector('#targets'),projectilesRoot=document.querySelector('#projectiles'),cameraElement=document.querySelector('a-camera'),statusElement=document.querySelector('#status'),scoreElement=document.querySelector('#score'),projectiles=[];let score=0,spawnTimer=0,lastFrame=0;function removeEntity(entity){if(entity?.parentNode)entity.parentNode.removeChild(entity)}
function randomTarget(){if(targetsRoot.children.length>=7)return;const types=[{tag:'a-box',geometry:'width:.7;height:.7;depth:.7',color:'#d96c4f',radius:.55},{tag:'a-cone',geometry:'radius-bottom:.45;radius-top:0;height:.9',color:'#e0b04f',radius:.58},{tag:'a-cylinder',geometry:'radius:.43;height:.8',color:'#68a991',radius:.55}],type=types[Math.floor(Math.random()*types.length)],target=document.createElement(type.tag);target.setAttribute('geometry',type.geometry);target.setAttribute('material',`color:${type.color};roughness:.55`);target.setAttribute('position',`${(Math.random()*8-4).toFixed(2)} ${(Math.random()*2.2+.6).toFixed(2)} ${(Math.random()*-11-2).toFixed(2)}`);target.classList.add('target');targetsRoot.appendChild(target)}
function fire(){if(!cameraElement.object3D){statusElement.textContent='Caméra non prête';return}const origin=new AFRAME.THREE.Vector3(),direction=new AFRAME.THREE.Vector3();cameraElement.object3D.getWorldPosition(origin);cameraElement.object3D.getWorldDirection(direction);const projectile=document.createElement('a-sphere');projectile.setAttribute('radius','.11');projectile.setAttribute('color','#ffd36b');projectile.setAttribute('material','emissive:#ff8c24;emissiveIntensity:3');projectilesRoot.appendChild(projectile);projectile.object3D.position.copy(origin);projectiles.push({element:projectile,velocity:direction.multiplyScalar(28),life:3});statusElement.textContent='Projectile lancé'}
function playHitSound(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;window.hitAudio??=new C;const now=hitAudio.currentTime,o=hitAudio.createOscillator(),g=hitAudio.createGain();o.type='triangle';o.frequency.setValueAtTime(520,now);o.frequency.exponentialRampToValueAtTime(160,now+.12);g.gain.setValueAtTime(.18,now);g.gain.exponentialRampToValueAtTime(.001,now+.12);o.connect(g).connect(hitAudio.destination);o.start();o.stop(now+.12)}
function impact(target,projectile){if(!target.parentNode||projectile.dataset.spent)return;projectile.dataset.spent='true';const p=new AFRAME.THREE.Vector3();target.object3D.getWorldPosition(p);for(let i=0;i<12;i++){const particle=document.createElement('a-sphere');particle.setAttribute('radius','.035');particle.setAttribute('color','#ffd36b');particle.setAttribute('position',`${p.x} ${p.y} ${p.z}`);particle.setAttribute('animation',`property:position;to:${p.x+Math.random()*2-1} ${p.y+Math.random()*2} ${p.z+Math.random()*2-1};dur:450;easing:easeOutQuad`);document.querySelector('a-scene').appendChild(particle);setTimeout(()=>removeEntity(particle),500)}playHitSound();removeEntity(target);removeEntity(projectile);score++;scoreElement.textContent=score;statusElement.textContent='Impact détecté'}
function reset(){[...targetsRoot.children,...projectilesRoot.children].forEach(removeEntity);projectiles.length=0;score=0;scoreElement.textContent='0';statusElement.textContent='Cibles réinitialisées'}function update(time){const delta=Math.min((time-lastFrame)/1000||0,.05);lastFrame=time;spawnTimer+=delta;if(spawnTimer>=1.5){spawnTimer=0;randomTarget()}for(let i=projectiles.length-1;i>=0;i--){const item=projectiles[i],position=item.element.object3D.position;position.addScaledVector(item.velocity,delta);item.life-=delta;let hit=false;for(const target of [...targetsRoot.querySelectorAll('.target')]){const targetPosition=new AFRAME.THREE.Vector3();target.object3D.getWorldPosition(targetPosition);if(position.distanceTo(targetPosition)<.65){impact(target,item.element);hit=true;break}}if(hit||item.life<=0){removeEntity(item.element);projectiles.splice(i,1)}}requestAnimationFrame(update)}
sceneElement.addEventListener('loaded',()=>{for(let i=0;i<3;i++)randomTarget();requestAnimationFrame(update)});window.addEventListener('pointerdown',()=>{window.hitAudio?.resume();fire()},true);sceneElement.addEventListener('click',()=>{window.hitAudio?.resume();fire()});window.addEventListener('keydown',event=>{if(event.code==='Space'||event.key===' '||event.keyCode===32){event.preventDefault();window.hitAudio?.resume();fire()}if(event.code==='KeyR')reset()},true);
</script></body></html>
